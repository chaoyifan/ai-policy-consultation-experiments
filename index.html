<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>实验网站入口</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f8fb; color: #20242b; }
    main { width: min(680px, calc(100% - 32px)); background: #fff; border: 1px solid #e7eaf0; border-radius: 20px; padding: 32px; box-shadow: 0 12px 40px rgba(35, 45, 70, .08); }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 0 0 24px; color: #6c7480; line-height: 1.7; }
    a { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px; border: 1px solid #dfe5ef; border-radius: 14px; color: #245dc1; text-decoration: none; font-weight: 650; }
    a:hover { background: #f7faff; border-color: #b9cdf5; }
    small { color: #8b929c; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>实验网站入口</h1>
    <p>请选择对应的实验编号进入。请仅使用研究者提供给你的指定链接。</p>
    <a href="./s01/g01/a/">
      <span>S01-G01-A</span>
      <small>进入实验 →</small>
    </a>
  </main>
</body>
</html>
