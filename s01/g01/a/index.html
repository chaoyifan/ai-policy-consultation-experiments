<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>澄言｜政策咨询</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#fff; --text:#202124; --muted:#8b919a;
    --line:#eceef2; --user:#eaf3ff; --accent:#4b84f4; --chip:#fff;
    --shadow:0 4px 18px rgba(30,40,60,.06);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
  .app{height:100%;max-width:760px;margin:auto;background:#fff;display:flex;flex-direction:column}
  .topbar{height:62px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.96);z-index:3}
  .back{font-size:28px;border:0;background:none;padding:6px 8px;cursor:default}
  .head{flex:1;text-align:center;margin-left:70px}
  .title{font-size:18px;font-weight:650}.sub{font-size:11px;color:var(--muted);margin-top:2px}
  .tools{display:flex;gap:7px}
  .tool{font-size:12px;border:1px solid var(--line);background:#fff;padding:7px 10px;border-radius:11px;cursor:pointer;color:#555b64}
  .chat{flex:1;overflow:auto;padding:24px 16px 140px;background:linear-gradient(#fff,#fbfcfe)}
  .row{display:flex;gap:9px;align-items:flex-start;margin-bottom:17px}
  .row.user{justify-content:flex-end}
  .avatar{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;overflow:hidden;box-shadow:0 2px 8px rgba(60,75,110,.12);background:#eef2f8}
  .msgwrap{max-width:75%}
  .bubble{padding:12px 15px;border-radius:17px;background:#fff;border:1px solid #f0f1f3;box-shadow:var(--shadow);font-size:16px;line-height:1.7;white-space:pre-wrap;text-align:justify;text-justify:inter-ideograph}
  .user .bubble{background:var(--user);border-color:#dbeafe;box-shadow:none;text-align:left}
  .time{font-size:11px;color:#a0a5ad;margin-top:4px}.user .time{text-align:right}
  .quick{margin:0 0 22px 41px;display:flex;flex-wrap:wrap;gap:9px}
  .chip{border:1px solid #dfe3e9;background:var(--chip);padding:10px 15px;border-radius:999px;font-size:14px;cursor:pointer}
  .chip:hover{background:#f8fbff;border-color:#b9d0ff}
  .hint{display:none;margin:-5px 0 18px 41px;color:#a35d00;background:#fff8eb;border:1px solid #fde4ad;border-radius:12px;padding:9px 11px;font-size:13px;max-width:590px}
  .analysis{margin:0 0 20px 41px;padding:11px 13px;border-radius:13px;background:#f7f8fa;border:1px solid var(--line);font-size:14px;color:#5d626a;display:flex;align-items:center;gap:9px}
  .spin{width:15px;height:15px;border:2px solid #d7dbe2;border-top-color:var(--accent);border-radius:50%;animation:s .8s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .typing{display:flex;gap:4px;height:16px;align-items:center}
  .typing i{display:block;width:6px;height:6px;background:#969ca6;border-radius:50%;animation:t 1.1s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.12s}.typing i:nth-child(3){animation-delay:.24s}
  @keyframes t{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
  .finish{display:none;margin-left:41px}
  .finish button{border:0;background:var(--accent);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:650;cursor:pointer}
  .composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);padding:12px 14px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 22%,#fff)}
  .input{height:50px;border:1px solid var(--line);background:#f7f8fa;border-radius:17px;display:flex;align-items:center;padding:0 13px;color:#a4a9b1}
  .input span:nth-child(2){flex:1;margin-left:10px}.send{width:32px;height:32px;border-radius:50%;background:#bfd0f4;color:#fff;display:flex;align-items:center;justify-content:center}
  .modal{position:fixed;inset:0;background:rgba(20,25,33,.34);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
  .modal.open{display:flex}.card{background:#fff;border-radius:18px;max-width:600px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
  .card h3{margin:0 0 14px;font-size:20px}.card ul,.card ol{line-height:1.9;padding-left:23px;margin:0}
  .close{width:100%;margin-top:18px;border:0;background:#f1f3f6;padding:11px;border-radius:11px}
  @media(max-width:600px){.head{margin-left:0}.msgwrap{max-width:82%}.bubble{font-size:15px}.tool{padding:6px 8px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <button class="back">‹</button>
    <div class="head"><div class="title">澄言</div><div class="sub">智能助手</div></div>
    <div class="tools"><button class="tool" id="meBtn">我的情况</button><button class="tool" id="policyBtn">政策摘要</button></div>
  </div>
  <main class="chat" id="chat"></main>
  <div class="composer"><div class="input"><span>＋</span><span>通过下方快捷选项回复…</span><div class="send">↑</div></div></div>
</div>

<div class="modal" id="meModal"><div class="card">
  <h3>我的情况</h3>
  <ul>
    <li>住房情况：我目前在H市无自有住房</li>
    <li>本月工资：5500元</li>
    <li>其他情况：本月收到1000元一次性医疗补助</li>
    <li>咨询目标：确认我是否符合H市首次购房补贴申请条件</li>
  </ul>
  <button class="close">关闭</button>
</div></div>

<div class="modal" id="policyModal"><div class="card">
  <h3>H市首次购房补贴政策摘要</h3>
  <ol>
    <li>申请人在H市无自有住房；</li>
    <li>申请月可计入收入不超过6000元；</li>
    <li>工资和绩效奖金计入可计入收入；</li>
    <li>一次性医疗补助不计入可计入收入。</li>
  </ol>
  <button class="close">关闭</button>
</div></div>

<script>
const chat=document.getElementById('chat');
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const now=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function scroll(){setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}),30)}
function add(role,text,typing=false){
  const r=document.createElement('div');r.className='row '+(role==='user'?'user':'assistant');
  if(role==='assistant'){const a=document.createElement('div');a.className='avatar';a.setAttribute('aria-label','澄言头像');a.innerHTML=`<svg viewBox="0 0 64 64" width="34" height="34" aria-hidden="true">
<rect width="64" height="64" rx="18" fill="#E9EEF9"/>
<circle cx="32" cy="24" r="11" fill="#F3C9A8"/>
<path d="M22 23c1-9 5-13 11-13 7 0 11 5 11 13-4-2-8-4-12-4-4 0-7 1-10 4z" fill="#3B4050"/>
<path d="M13 58c2-12 10-19 19-19s17 7 19 19" fill="#6F8FD8"/>
<path d="M25 39c2 4 5 6 7 6s5-2 7-6" fill="#F3C9A8"/>
</svg>`;r.appendChild(a)}
  const w=document.createElement('div');w.className='msgwrap';
  const b=document.createElement('div');b.className='bubble';
  if(typing)b.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  else b.innerHTML=esc(text).replace(/\n/g,'<br>');
  w.appendChild(b);
  if(!typing){const tm=document.createElement('div');tm.className='time';tm.textContent=now();w.appendChild(tm)}
  r.appendChild(w);chat.appendChild(r);scroll();return r;
}
async function ai(text,delay=550){const t=add('assistant','',true);await wait(delay);t.remove();add('assistant',text)}
function warn(){let h=document.querySelector('.hint');if(!h){h=document.createElement('div');h.className='hint';h.textContent='请根据情景中设定的“我的情况”作答。';chat.appendChild(h)}h.style.display='block';scroll()}
function clearWarn(){const h=document.querySelector('.hint');if(h)h.style.display='none'}
function quick(options,correct,next){
  const q=document.createElement('div');q.className='quick';
  options.forEach(o=>{const b=document.createElement('button');b.className='chip';b.textContent=o;b.onclick=()=>{
    if(o!==correct){warn();return}
    clearWarn();add('user',o);q.remove();next();
  };q.appendChild(b)});chat.appendChild(q);scroll();
}
async function analyzing(){
  const a=document.createElement('div');a.className='analysis';a.innerHTML='<span class="spin"></span><span>正在分析政策条件…</span>';chat.appendChild(a);scroll();await wait(2200);a.remove();
}
async function run(){
  add('user','根据H市首次购房补贴政策，我想确认一下自己是否符合申请条件。');
  await ai('可以。我先了解一下您的具体情况，再帮您判断。');
  await ai('请问您目前在H市名下有自有住房吗？');
  quick(['有','没有'],'没有',async()=>{
    await ai('明白了。请问您本月的工资收入是多少？');
    quick(['4500元','5500元','6500元'],'5500元',async()=>{
      await ai('除了工资以外，您本月还有奖金、补助或其他收入吗？');
      quick(['没有其他收入','有1000元绩效奖金','有1000元一次性医疗补助'],'有1000元一次性医疗补助',async()=>{
        await ai('好的，我已经了解您的情况。我正在根据H市首次购房补贴政策进行判断。');
        await analyzing();
        await ai('根据您提供的信息，您符合申请条件。您本月工资为5500元，未超过6000元收入上限；一次性医疗补助不计入可计入收入，住房情况也符合要求。',700);
        const f=document.createElement('div');f.className='finish';f.style.display='block';f.innerHTML='<button>我已阅读AI建议</button>';chat.appendChild(f);scroll();
        f.querySelector('button').onclick=()=>{f.innerHTML='<div style="font-size:14px;color:#59606a;padding:10px 0">咨询已完成，请返回问卷继续作答。</div>';};
      });
    });
  });
}
document.getElementById('meBtn').onclick=()=>document.getElementById('meModal').classList.add('open');
document.getElementById('policyBtn').onclick=()=>document.getElementById('policyModal').classList.add('open');
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('.modal').classList.remove('open'));
document.querySelectorAll('.modal').forEach(m=>m.onclick=e=>{if(e.target===m)m.classList.remove('open')});
run();
</script>
</body>
</html>
